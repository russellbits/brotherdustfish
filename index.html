<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Grid Navigation with &lt;section&gt;</title>
    <link rel="stylesheet" href="house.css">
</head>
<body>

    <div class="key-instructions">
        <img src="images/keyboard-arrow-keys.svg" alt="Keyboard Arrow Keys" />
        <h4>Navigate with keys or swipe.</h4>
    </div>

    <main id="grid-container">
        <section>
          <h1>Home</h1>
          <p>This is section 0,0 of &lt;section&gt; tags.</p>
          <p></p>
        </section>
        <section><h1>1,0</h1></section>
        <section><h1>2,0</h1></section>

        <section><h1>0,1</h1></section>
        <section><h1>1,1</h1></section>
        <section><h1>2,1</h1></section>

        <section><h1>0,2</h1></section>
        <section><h1>1,2</h1></section>
        <section>
            <h1>Bottom Right</h1>
            <p>Goodbye</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
